<!-- Layout del panel de administración: sidebar fijo + contenido principal -->
<div class="min-h-screen flex bg-cream">

  <!-- ── SIDEBAR ──────────────────────────────────────────────────── -->
  <aside class="w-64 bg-charcoal flex flex-col shrink-0">

    <!-- Logo -->
    <div class="px-6 py-6 border-b border-white border-opacity-10">
      <a href="/" class="font-serif text-2xl text-white">Lumière</a>
      <p class="text-xs text-warm-gray mt-1 uppercase tracking-widest">Panel Admin</p>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-4 py-6 space-y-1">
      @for (item of navItems; track item.href) {
        <a
          [routerLink]="item.href"
          routerLinkActive="bg-white bg-opacity-10 text-white"
          [routerLinkActiveOptions]="{ exact: item.href === '/admin' }"
          class="flex items-center gap-3 px-4 py-3 rounded-sm text-sm font-medium
                 text-warm-gray hover:text-white hover:bg-white hover:bg-opacity-10
                 transition-all duration-200 group">
          <!-- Icono SVG dinámico -->
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon"/>
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Pie del sidebar: info del admin + logout -->
    <div class="px-4 py-6 border-t border-white border-opacity-10">
      <div class="flex items-center gap-3 mb-4 px-4">
        <div class="w-8 h-8 bg-gold flex items-center justify-center shrink-0">
          <span class="text-white text-xs font-semibold">
            {{ auth.currentUser()?.email?.charAt(0)?.toUpperCase() }}
          </span>
        </div>
        <div class="min-w-0">
          <p class="text-white text-xs font-medium truncate">{{ auth.currentUser()?.email }}</p>
          <p class="text-warm-gray text-xs">Administrador</p>
        </div>
      </div>
      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2 text-warm-gray text-sm
               hover:text-red-400 transition-colors duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </aside>

  <!-- ── CONTENIDO PRINCIPAL ──────────────────────────────────────── -->
  <main class="flex-1 overflow-auto">
    <router-outlet />
  </main>

</div>
